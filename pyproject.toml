[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fund-analysis"
version = "0.1.0"
description = "Local-first fund valuation and holdings workbench."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
test = ["httpx", "mypy", "ruff"]

[project.scripts]
fund-analysis = "fund_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
